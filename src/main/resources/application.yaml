server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: backend-facturacion

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:facturacion_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    # Lista de nodos del clúster (host1:5672,host2:5672)
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/8ea291c8-4670-4598-8f0f-b5e216b5b755/v2.0
          jwk-set-uri: https://login.microsoftonline.com/8ea291c8-4670-4598-8f0f-b5e216b5b755/discovery/v2.0/keys
          # Valida que el token sea para esta app
          audiences: c6445b4c-7863-42ac-a620-2fa3b5ea58d8

# Nombres de exchanges, colas y routing keys centralizados (ver RabbitMQProperties)
app:
  rabbitmq:
    exchanges:
      # Consume: orden creada (topic que publica órdenes)
      ordenes-topic: "ordenes.topic.exchange"
      # Publica: boleta emitida (la consume ordenes)
      facturacion-direct: "facturacion.direct.exchange"
      # Dead letter exchange propio de este microservicio
      dlx: "facturacion.dlx.exchange"
    queues:
      facturacion-orden: "facturacion.orden.creada.queue"
      facturacion-dlq: "facturacion.orden.creada.dlq"
    routing-keys:
      orden-creada: "orden.creada.#"
      orden-creada-exact: "orden.creada.key"
      boleta-emitida: "boleta.emitida.key"
      dlq: "facturacion.dlq.key"
